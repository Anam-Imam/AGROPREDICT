name: smart_agri_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  geolocator: ^11.0.0
  geocoding: ^3.0.0

  dio: ^5.7.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  image_picker: ^1.0.7
  table_calendar: ^3.0.9
  flutter_bloc: ^8.1.6
  fl_chart: ^0.64.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"